    <script>
      (function() {
        var theme = localStorage.getItem('dimlit-theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dawn)').matches ? 'dawn' : 'night';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
